[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riverplan"
version = "0.2.0"
description = "SAT-based boat crossing schedules and minimum travel times."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["python-sat==1.9.dev15"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.0", "build==1.3.0"]

[project.scripts]
riverplan = "riverplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
