name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: python -m pip install -c requirements.lock -e '.[dev]'
      - name: Check and test
        run: |
          python -m pip check
          ruff check .
          ruff format --check .
          pytest
      - name: Build and verify installed package
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          python -c 'import riverplan; assert "site-packages" in riverplan.__file__'
          riverplan 1 2 5 10 --capacity 2 --json
